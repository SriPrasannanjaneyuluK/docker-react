name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker run login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD}}

      - name: Build Docker Image
        run: docker build -t react-test -f Dockerfile.dev .

      - name: Run Tests
        run: docker run -e CI=true react-test npm test -- --coverage