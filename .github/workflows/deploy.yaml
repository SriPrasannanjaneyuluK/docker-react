name: Deploy Frontend
on:
  push:
    branch:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -P {{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t bymywheels/react-test -f Dockerfile.dev .
      - run: docker run -e CI=true bymywheels/react-test npm test